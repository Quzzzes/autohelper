version: '3.9'

# Локальная среда разработки «Авто-помощник BY»
# Запуск: docker compose up -d
# Остановка: docker compose down

services:

  # PostgreSQL — основная база данных
  postgres:
    image: postgres:16-alpine
    container_name: autohelper_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: autohelper
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"          # доступен локально для отладки в DBeaver/pgAdmin
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d autohelper"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis — кэш (штрафы TTL 4 часа) и очереди
  redis:
    image: redis:7-alpine
    container_name: autohelper_redis
    restart: unless-stopped
    ports:
      - "6379:6379"          # доступен локально для отладки
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Бэкенд — Node.js API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev       # dev-образ с hot reload
    container_name: autohelper_backend
    restart: unless-stopped
    env_file: .env.local
    ports:
      - "3000:3000"          # API доступен на http://localhost:3000
    volumes:
      - ./backend:/app       # монтируем код — изменения применяются сразу
      - /app/node_modules    # node_modules остаётся внутри контейнера
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
