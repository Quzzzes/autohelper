[versions]
agp             = "8.5.2"
kotlin          = "2.0.0"
ksp             = "2.0.0-1.0.24"
hilt            = "2.51.1"
compose-bom     = "2024.09.00"
lifecycle       = "2.8.6"
navigation      = "2.8.2"
retrofit        = "2.11.0"
okhttp          = "4.12.0"
room            = "2.6.1"
datastore       = "1.1.1"
coroutines      = "1.8.1"
coil            = "2.7.0"

[libraries]
# Compose
compose-bom             = { group = "androidx.compose", name = "compose-bom",         version.ref = "compose-bom" }
compose-ui              = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling      = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3       = { group = "androidx.compose.material3", name = "material3" }
compose-icons           = { group = "androidx.compose.material", name = "material-icons-extended" }
activity-compose        = { group = "androidx.activity", name = "activity-compose",   version = "1.9.2" }

# Navigation
navigation-compose      = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Lifecycle / ViewModel
lifecycle-viewmodel     = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime       = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",   version.ref = "lifecycle" }

# Hilt DI
hilt-android            = { group = "com.google.dagger", name = "hilt-android",         version.ref = "hilt" }
hilt-compiler           = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation         = { group = "androidx.hilt",     name = "hilt-navigation-compose", version = "1.2.0" }

# Retrofit (HTTP)
retrofit                = { group = "com.squareup.retrofit2", name = "retrofit",        version.ref = "retrofit" }
retrofit-gson           = { group = "com.squareup.retrofit2", name = "converter-gson",  version.ref = "retrofit" }
okhttp-logging          = { group = "com.squareup.okhttp3",   name = "logging-interceptor", version.ref = "okhttp" }

# Room (local DB)
room-runtime            = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
room-ktx                = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
room-compiler           = { group = "androidx.room", name = "room-compiler",  version.ref = "room" }

# DataStore (токены)
datastore               = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Coroutines
coroutines              = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Coil (загрузка изображений)
coil                    = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

[plugins]
android-application     = { id = "com.android.application",         version.ref = "agp" }
kotlin-android          = { id = "org.jetbrains.kotlin.android",    version.ref = "kotlin" }
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt                    = { id = "com.google.dagger.hilt.android",  version.ref = "hilt" }
ksp                     = { id = "com.google.devtools.ksp",         version.ref = "ksp" }
